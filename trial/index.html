<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messianic Praise! 2026 · Media Rota</title>
<meta name="description" content="Media team rota for Messianic Praise! 2026 — see your shifts, who's leading and who's on now.">
<meta name="theme-color" content="#0B1533">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MP Rota">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" as="image" href="logo.webp" fetchpriority="high">
<link rel="preload" as="script" href="app.js?v=20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles.css?v=20">
<style>
  /* critical splash styles inline so it paints instantly */
  html,body{margin:0;background:#070E26}
  #splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(120% 80% at 50% 42%,#16275E 0%,#0B1533 45%,#050A1C 100%);overflow:hidden;cursor:pointer}
</style>
</head>
<body>

<!-- ===== Animated opening ===== -->
<div id="splash" aria-label="Messianic Praise 2026" role="img">
  <div class="sp-beams" aria-hidden="true"></div>
  <div class="sp-stage" aria-hidden="true">
    <span class="sp-ring r1"></span><span class="sp-ring r2"></span><span class="sp-ring r3"></span>
    <div class="sp-sparks" id="spSparks"></div>
    <div class="sp-logo-wrap">
      <img class="sp-logo" src="logo.webp" alt="" fetchpriority="high" decoding="async">
      <span class="sp-shine"></span>
    </div>
  </div>
  <div class="sp-text" aria-hidden="true">
    <div class="sp-kicker">MEDIA TEAM</div>
    <div class="sp-date"><span>27</span><i></i><span>11</span><i></i><span>26</span></div>
  </div>
  <div class="sp-skip" aria-hidden="true">Tap to skip</div>
</div>

<!-- ===== App ===== -->
<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <img src="logo-sm.webp" alt="" class="brand-logo" width="46" height="39">
      <div class="brand-text">
        <div class="brand-title">Messianic Praise! 2026</div>
        <button class="sync" id="syncBtn" type="button" aria-label="Refresh rota">
          <span class="sync-dot" id="syncDot"></span><span id="syncText">Loading rota…</span>
        </button>
      </div>
    </div>
    <button class="icon-btn" id="leaderBtn" type="button" aria-label="Leader editing">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </button>
  </header>

  <div id="ptr" class="ptr" aria-hidden="true"><img src="logo-sm.webp" alt=""><span id="ptrText">Pull to refresh</span></div>
  <div id="demoBar" class="demo-bar" hidden></div>
  <div id="installBar" class="install-bar" hidden></div>
  <div id="leaderBar" class="leader-bar" hidden></div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#me" data-tab="me">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <span>My shifts</span></a>
    <a href="#now" data-tab="now">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <span>Live now</span></a>
    <a href="#prog" data-tab="prog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      <span>Programme</span></a>
    <a href="#teams" data-tab="teams">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M15 14.6c3 0 6 1.6 6 4.9"/></svg>
      <span>Teams</span></a>
    <a href="#rota" data-tab="rota">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16M15 4v16"/></svg>
      <span>Full rota</span></a>
  </nav>
</div>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="alerts" class="alerts" aria-live="assertive"></div>

<script src="config.js?v=20"></script>
<script src="programme.js?v=20"></script>
<script src="app.js?v=20"></script>
</body>
</html>
